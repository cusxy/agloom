name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run of the deploy jobs without bumping the package
  # version — useful when the site build needs to be promoted to
  # production after a workflow/config fix without republishing
  # the npm tarball.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  publish:
    # Publish only on actual tag pushes. Manual dispatches skip this
    # job entirely so the deploy jobs can run against an already
    # published version without npm rejecting a duplicate upload.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # npm's Trusted Publisher config for this package includes an
    # environment name (`default`), so the OIDC id token minted for
    # this job must carry the matching `environment` claim. The
    # claim only appears when the job itself joins a GitHub
    # environment, hence this declaration. The secrets this
    # environment holds (Cloudflare tokens) are not referenced here
    # — publish only consumes the GitHub-minted OIDC token.
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Intentionally no `registry-url`: that option asks
          # actions/setup-node to stamp out a .npmrc with an
          # `_authToken=${NODE_AUTH_TOKEN}` template, and the action
          # then exports a placeholder NODE_AUTH_TOKEN so the
          # template always resolves. With that placeholder in
          # place, `npm publish` skips OIDC Trusted Publisher auth
          # and tries the placeholder as a classic token, which
          # npm rejects with a misleading `PUT /agloom → 404`.
          # Leaving registry-url unset keeps .npmrc clean so npm
          # CLI takes the OIDC path.

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run test

      # Hybrid publish path: pnpm packs the tarball (correctly
      # rewriting `workspace:*` → concrete versions for the
      # devDependency on @agloom/markdown-tools), then npm CLI
      # uploads the pre-packed tarball. We go through npm for the
      # upload because pnpm 10 still auths the npm PUT with the
      # classic _authToken from .npmrc, which in a CI context is
      # the placeholder that actions/setup-node bakes in — npm
      # rejects that with `PUT /agloom → 404`. Trusted Publisher
      # OIDC auth (the flow we actually want) landed in npm 11.5.1;
      # Node 22 ships with 10.9.x so we upgrade first.
      - name: Pack tarball with pnpm (resolves workspace:* refs)
        run: pnpm pack

      # Use npx to run a freshly downloaded npm@latest rather than
      # `npm install -g npm@latest`. The latter routinely leaves
      # Node 22's bundled npm in a half-upgraded state ("Cannot find
      # module 'promise-retry'" and similar) because the installer
      # overwrites files under the same global prefix the running
      # npm is reading from. npx runs the new npm in a throwaway
      # temp dir, so the bootstrap install never touches the
      # system-wide copy.
      - name: Publish tarball via npm (OIDC Trusted Publisher)
        run: npx -y npm@latest publish agloom-*.tgz --provenance

  deploy-docs:
    needs: publish
    # Run after a successful publish (tag push) OR after publish was
    # skipped (manual dispatch). `always()` is required because a
    # skipped dependency would otherwise cascade-skip this job.
    if: |
      always() &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    name: Deploy Docs
    # Cloudflare secrets (tokens, account id) live in the `default`
    # GitHub environment, so the job must declare membership to see
    # them — otherwise `secrets.*` resolves to empty strings and
    # wrangler / the analytics beacon get no credentials.
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        run: cd website && pnpm run build:site
        env:
          CF_ANALYTICS_TOKEN_DOCS: ${{ secrets.CF_ANALYTICS_TOKEN_DOCS }}

      - name: Deploy to Cloudflare Pages
        # --branch=main is required: without it, wrangler reads the
        # git context (detached HEAD on a tag push, or the dispatch
        # ref on workflow_dispatch) and lands the upload in the
        # project's preview slot. Production is only assigned to
        # deployments whose branch matches the project's configured
        # production branch (main).
        run: npx wrangler pages deploy website/build --project-name=agloom-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-landing:
    needs: publish
    # Same gating as deploy-docs: tag push with successful publish,
    # or manual dispatch (publish skipped).
    if: |
      always() &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    name: Deploy Landing
    # Same reasoning as deploy-docs — Cloudflare secrets are scoped
    # to the `default` environment and become visible only to jobs
    # that join it.
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Astro landing
        run: pnpm --filter @agloom/landing build
        env:
          CF_ANALYTICS_TOKEN_LANDING: ${{ secrets.CF_ANALYTICS_TOKEN_LANDING }}

      - name: Deploy to Cloudflare Pages
        # See deploy-docs for the reason behind --branch=main.
        run: npx wrangler pages deploy landing/dist --project-name=agloom --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
