name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm's Trusted Publisher config for this package includes an
    # environment name (`default`), so the OIDC id token minted for
    # this job must carry the matching `environment` claim. The
    # claim only appears when the job itself joins a GitHub
    # environment, hence this declaration. The secrets this
    # environment holds (Cloudflare tokens) are not referenced here
    # — publish only consumes the GitHub-minted OIDC token.
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run test

      # TEMPORARY debug: decode the OIDC id token minted for the
      # "npm" audience and print its claim set so we can compare
      # against the npm Trusted Publisher config. Remove after the
      # first successful publish.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sSL "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # Pad base64url to multiple of 4
          PADDED="$PAYLOAD$(printf '=%.0s' $(seq 1 $((4 - ${#PAYLOAD} % 4))))"
          DECODED=$(echo "$PADDED" | tr '_-' '/+' | base64 -d 2>/dev/null)
          echo "OIDC payload:"
          echo "$DECODED" | jq '{
            iss, aud, repository, repository_owner, workflow,
            workflow_ref, job_workflow_ref, event_name, ref,
            environment, sub
          }'

      - run: pnpm publish --no-git-checks --provenance

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    name: Deploy Docs
    # Cloudflare secrets (tokens, account id) live in the `default`
    # GitHub environment, so the job must declare membership to see
    # them — otherwise `secrets.*` resolves to empty strings and
    # wrangler / the analytics beacon get no credentials.
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        run: cd website && pnpm run build:site
        env:
          CF_ANALYTICS_TOKEN_DOCS: ${{ secrets.CF_ANALYTICS_TOKEN_DOCS }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy website/build --project-name=agloom-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-landing:
    needs: publish
    runs-on: ubuntu-latest
    name: Deploy Landing
    # Same reasoning as deploy-docs — Cloudflare secrets are scoped
    # to the `default` environment and become visible only to jobs
    # that join it.
    environment: default
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Astro landing
        run: pnpm --filter @agloom/landing build
        env:
          CF_ANALYTICS_TOKEN_LANDING: ${{ secrets.CF_ANALYTICS_TOKEN_LANDING }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy landing/dist --project-name=agloom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
