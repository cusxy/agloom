name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate docs linked list
        run: npx tsx scripts/validate-docs-linked-list.ts

      - name: Build Docusaurus site
        run: cd website && pnpm run build:site

      - run: pnpm run build

      - run: pnpm run lint

      - run: pnpm run fmt:check

      - run: pnpm run test
