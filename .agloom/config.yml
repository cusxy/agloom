# Agloom configuration
# List of adapters to use by default when no --adapter or --all flag is provided.
# Run 'agloom adapters --all' to see all available adapters.
adapters:
  - claude
  - opencode

plugins:
  - "git@github.com:cusxy/skill-cycling#v0.1.0"

# Markdownlint overrides — see docs/guide/formatting.md
markdownlint:
  # MD033 (inline HTML) allows Docusaurus JSX components. Strictly
  # speaking these are not HTML — markdownlint cannot tell the
  # difference between <div> and <Tabs>, so we explicitly allow the
  # Docusaurus components used across docs/.
  MD033:
    allowed_elements:
      - Tabs
      - TabItem
