$schema: ../meta-schema.json

name: research
version: '0.1.0'
description: >
  Исследование и анализ. Фиксирует контекст, рассмотренные объекты анализа
  и обоснование выводов. Служит справочным материалом при пересмотре решений.

frontmatter:
  required:
    summary:
      type: string
      minLength: 1
      description: Заголовок исследования
    description:
      type: string
      minLength: 1
      description: Краткое описание (1-2 предложения)
  optional:
    relates:
      type: array
      items:
        type: string
      description: Связанные документы (кросс-ссылки)
  additionalProperties: false

structure:
  headings:
    require_h1: true
    max_h1: 1
    max_depth: 4
    no_level_skip: true
  sections:
    - heading: 'Контекст исследования'
      level: 2
      description: Проблема, мотивация, цель и границы исследования
    - heading: 'Заключение'
      level: 2
      description: Сводка результатов — таблица принятых решений с обоснованием
    - heading: 'Источники'
      level: 2
      optional: true
      severity: warning
      description: Ссылки на внешние материалы — стандарты, исследования, документацию

prose:
  style: academic
  language: ru
  person: third
  rfc2119: optional

references:
  frontmatter:
    relates:
      target_must_exist: true
      allowed_extensions: ['.md']
  internal_links:
    must_resolve: true
    check_anchors: true

review:
  criteria:
    - id: R1
      rule: Присутствует дата проведения исследования
      severity: warning
    - id: R2
      rule: Рассмотрены минимум три объекта анализа
      description: >
        Минимум три объекта анализа (подходы, варианты решения, провайдеры и т.д.).
        Два объекта создают иллюзию бинарного выбора (false dichotomy).
      severity: warning
    - id: R3
      rule: Каждый объект анализа содержит и плюсы, и минусы
      description: >
        Каждый объект анализа ДОЛЖЕН содержать минимум один явный плюс и один явный минус.
        Отсутствие минусов — индикатор confirmation bias.
      severity: error
      examples:
        pass:
          - text: "**Плюсы:**\n- Минимальная сложность.\n\n**Минусы:**\n- Код крипто может отличаться от тикера."
        fail:
          - text: "**Плюсы:**\n- Минимальная сложность.\n- Следует индустриальной практике."
            explanation: 'У объекта анализа нет ни одного минуса — индикатор confirmation bias'
    - id: R4
      rule: Присутствует сравнительная таблица объектов анализа
      description: >
        Таблица, сопоставляющая все объекты анализа по критериям оценки.
      severity: warning
    - id: R5
      rule: Выводы явно сформулированы с обоснованием
      description: >
        Секция «Заключение» содержит явные выводы с аргументацией.
        Допустимые форматы: явный выбор («Выбран подход N, потому что...»),
        таблица решений или список аргументированных рекомендаций.
      severity: error
    - id: R6
      rule: Текст написан в третьем лице — нет обращений на «ты» и императивов
      severity: error
      examples:
        pass:
          - text: 'В ходе исследования было установлено, что подход A превосходит подход B.'
        fail:
          - text: 'Попробуй подход A, он лучше.'
    - id: R7
      rule: Текст не содержит разговорной лексики, сленга и неформальных сокращений
      severity: error
      examples:
        pass:
          - text: 'Данный подход обеспечивает высокую производительность.'
          - text: 'Результаты анализа представлены в таблице ниже.'
        fail:
          - text: 'Этот подход реально быстрый.'
          - text: 'Инфа по результатам — в табличке.'
    - id: R8
      rule: Заголовки секций используют полные формальные названия без сокращений
      severity: warning
  guidance: >
    Оценить объективность анализа — проверить индикаторы когнитивных искажений:

    1. Anchoring: первый объект описан значительно подробнее остальных
    или критерии оценки подогнаны под него. Сравнить объём описания объектов —
    разница более чем в 2 раза подозрительна.

    2. Confirmation bias: у объекта анализа отсутствуют минусы,
    контраргументы проигнорированы.

    3. Bandwagon: популярность технологии приводится как единственный аргумент
    без анализа соответствия проектному контексту («все используют X»).

    4. Strawman: объекты анализа описаны карикатурно, с преувеличенными недостатками,
    чтобы усилить предпочтительный вариант.

    5. Sunk cost / IKEA: «мы уже используем X» как основание для продолжения
    без анализа объектов по существу.

    Оценить качество выводов — каждый аргумент «потому что» трассируется к факту
    из анализа. Выводы не противоречат данным сравнительной таблицы.
    Цепочка «данные → выводы → рекомендация» прослеживается.

    Оценить полноту — все ли значимые объекты анализа рассмотрены, не упущены ли
    очевидные варианты. Критерии оценки не подогнаны под конкретный объект.
    Источники указаны и релевантны.
