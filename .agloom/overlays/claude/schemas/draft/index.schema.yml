$schema: ../meta-schema.json

name: index
version: '0.0.0'
description: >
  Общее описание концепции папки и пререквизиты для остальных файлов.
  Обязателен к прочтению при работе с любым файлом из папки.
  Один index.md на директорию.

frontmatter:
  required:
    summary:
      type: string
      minLength: 1
      description: Заголовок
    description:
      type: string
      minLength: 1
      description: Краткое описание (1-2 предложения)
  optional:
    relates:
      type: array
      items:
        type: string
      description: Связанные документы (кросс-ссылки)
  additionalProperties: false

structure:
  headings:
    require_h1: true
    max_h1: 1
    max_depth: 3
    no_level_skip: true

prose:
  style: academic
  language: ru
  person: third
  rfc2119: optional

references:
  frontmatter:
    relates:
      target_must_exist: true
      allowed_extensions: ['.md']
  internal_links:
    must_resolve: true
    check_anchors: true

review:
  criteria:
    - id: I1
      rule: Файл называется index.md
      severity: error
    - id: I2
      rule: В папке не более одного файла с типом index
      severity: error
    - id: I3
      rule: Текст написан в третьем лице — нет обращений на «ты» и императивов
      severity: error
    - id: I4
      rule: Текст не содержит разговорной лексики, сленга и неформальных сокращений
      severity: error
  guidance: >
    Проверить что содержимое служит пререквизитом для остальных файлов папки.
    Убедиться что общие положения не дублируются в дочерних документах.
    Проверить соответствие академическому стилю: формальная лексика, третье лицо.
