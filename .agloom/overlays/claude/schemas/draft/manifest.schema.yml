$schema: ../meta-schema.json

name: manifest
version: '0.0.0'
description: >
  Реестр компонентов системы. Содержит перечень компонентов, их расположение и связи.
  Стабильный документ: отражает структуру системы, а не её текущее состояние.
  Аналитические артефакты (результаты валидации, метрики, аудиты) не включаются.

frontmatter:
  required:
    summary:
      type: string
      minLength: 1
      description: Заголовок реестра
    description:
      type: string
      minLength: 1
      description: Краткое описание (1-2 предложения)
  optional:
    relates:
      type: array
      items:
        type: string
      description: Связанные документы (кросс-ссылки)
  additionalProperties: false

structure:
  headings:
    require_h1: true
    max_h1: 1
    max_depth: 4
    no_level_skip: true

prose:
  style: academic
  language: ru
  person: third
  rfc2119: optional

references:
  frontmatter:
    relates:
      target_must_exist: true
      allowed_extensions: ['.md']
  internal_links:
    must_resolve: true
    check_anchors: true

review:
  criteria:
    - id: M1
      rule: Все файловые пути в документе разрешаются в существующие файлы
      severity: error
    - id: M2
      rule: Не содержит аналитических или временных данных — метрики, аудиты, результаты валидации
      severity: error
      examples:
        pass:
          - text: 'spec-writer — создаёт и исправляет спецификации модулей'
        fail:
          - text: 'spec-writer — последний аудит: 2026-03-10, compliance: 85%'
    - id: M3
      rule: Текст написан в третьем лице — нет обращений на «ты» и императивов
      severity: error
    - id: M4
      rule: Текст не содержит разговорной лексики, сленга и неформальных сокращений
      severity: error
  guidance: >
    Проверить актуальность перечня компонентов — все ли компоненты перечислены,
    нет ли удалённых. Убедиться что описания компонентов соответствуют текущему состоянию.
    Проверить соответствие академическому стилю: формальная лексика, третье лицо.
