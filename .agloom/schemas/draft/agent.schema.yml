$schema: ../meta-schema.json

name: agent
version: '0.0.0'
description: >
  Определение агента для циклических скиллов-оркестраторов. Агент участвует в паре
  «исполнитель → reviewer» с quality gate между фазами. Содержит контракт (header)
  и инструкции (implementation), управляющие поведением LLM-агента.
  Использует собственный формат front matter, отличный от документационного.

frontmatter:
  required:
    name:
      type: string
      minLength: 1
      description: Идентификатор агента
    model:
      type: string
      minLength: 1
      description: Модель LLM
    description:
      type: string
      minLength: 1
      description: Краткое описание агента
  additionalProperties: false

structure:
  headings:
    require_h1: true
    max_h1: 1
    max_depth: 4
    no_level_skip: true
  sections:
    - heading: 'Общие документы'
      level: 2
      description: Список общих документов, обязательных к прочтению перед началом работы
    - heading: 'Входные параметры'
      level: 2
      description: Типы scope и context по переходам, в которых агент запускается
    - heading:
        pattern: '^Definition of Ready|^DoR$'
      level: 2
      description: Чеклист предусловий для начала работы агента
      lists:
        - type: task_list
          min: 1
    - heading:
        pattern: '^Definition of Done|^DoD$'
      level: 2
      description: Чеклист постусловий для завершения работы агента
      lists:
        - type: task_list
          min: 1
    - heading: 'Артефакты'
      level: 2
      optional: true
      severity: warning
      description: Перечень артефактов, создаваемых агентом (для исполнителей)
    - heading: 'Нештатные ситуации'
      level: 2
      optional: true
      severity: warning
      description: Обработка нештатных ситуаций (для исполнителей)
  content:
    tail_pattern: '^`returnTo`'

prose:
  style: instructional
  language: ru
  person: second
  rfc2119: required

references:
  internal_links:
    must_resolve: true
    check_anchors: true

review:
  criteria:
    - id: A5
      rule: Каждый ЗАПРЕЩАЕТСЯ имеет обоснование — слово «потому что» и причина
      severity: error
      examples:
        pass:
          - text: 'ЗАПРЕЩАЕТСЯ редактировать спецификации, потому что это нарушает трассируемость.'
        fail:
          - text: 'ЗАПРЕЩАЕТСЯ редактировать спецификации.'
    - id: A6
      rule: Пункты DoR/DoD бинарны — допускают только ответ да/нет
      description: >
        Проверять ТОЛЬКО пункты внутри секций «Definition of Ready» и «Definition of Done»
        (чеклисты с `- [ ]`). НЕ применять к пунктам в других секциях — критерии проверки,
        правила написания, описания шагов и т.д. не обязаны быть бинарными.
      severity: error
      examples:
        pass:
          - text: '- [ ] Все файлы из scope существуют'
        fail:
          - text: '- [ ] Качество кода приемлемое'
    - id: A7
      rule: Пункты DoR/DoD атомарны — одно условие на пункт
      severity: error
      examples:
        pass:
          - text: '- [ ] Тесты проходят'
        fail:
          - text: '- [ ] Тесты проходят и покрытие > 80%'
    - id: A8
      rule: Инструкции написаны во втором лице
      description: >
        Допустимы: «Тебе ТРЕБУЕТСЯ...», «Ты — research-writer», «Прочитай...».
        НЕ нарушение: безличные конструкции с RFC 2119 («ЗАПРЕЩАЕТСЯ редактировать»).
        Нарушение: третье лицо («Агент должен»), инфинитив без адресата («зафиксировать в findings»).
      severity: error
      examples:
        pass:
          - text: 'Тебе ТРЕБУЕТСЯ прочитать все файлы из scope.'
          - text: 'ЗАПРЕЩАЕТСЯ редактировать спецификации, потому что...'
            explanation: 'Безличная конструкция с RFC 2119 — допустимо'
        fail:
          - text: 'Агент должен прочитать все файлы из scope.'
            explanation: 'Третье лицо'
            fix: 'Тебе ТРЕБУЕТСЯ прочитать все файлы из scope.'
          - text: 'Зафиксировать в findings и завершить с verdict: fail.'
            explanation: 'Инфинитив без адресата'
            fix: 'Зафиксируй в findings и заверши с verdict: fail.'
  guidance: >
    Проверить что инструкции однозначны и не допускают вольных интерпретаций.
    Убедиться что DoR/DoD покрывают все аспекты качества артефактов агента.
    Проверить что запреты не конфликтуют с инструкциями.
