$schema: ../meta-schema.json

name: spec
version: '0.0.0'
description: >
  Спецификация модуля с жизненным циклом.
  Управляет имплементацией: код должен соответствовать спецификации.
  Имеет статус (draft -> ready -> implemented -> outdated).
  Единственный источник истины для фаз test и implement цикла spec-driven development.

frontmatter:
  required:
    summary:
      type: string
      minLength: 1
      description: Заголовок спецификации
    description:
      type: string
      minLength: 1
      description: Краткое описание (1-2 предложения)
    status:
      type: string
      enum: [draft, ready, implemented, outdated]
      description: Статус жизненного цикла спецификации
  optional:
    relates:
      type: array
      items:
        type: string
        pattern: "^(docs|apps|packages|\\.claude)/"
      description: Связанные документы (кросс-ссылки)
    maps_to:
      type: array
      items:
        type: string
      description: Пути к коду, реализующему спецификацию
  additionalProperties: false

structure:
  headings:
    require_h1: true
    max_h1: 1
    max_depth: 4
    no_level_skip: true

prose:
  style: academic
  language: ru
  person: third
  rfc2119: required

references:
  frontmatter:
    relates:
      target_must_exist: true
      allowed_extensions: ['.md']
    maps_to:
      target_must_exist: false
  internal_links:
    must_resolve: true
    check_anchors: true

review:
  criteria:
    - id: S1
      rule: Документ содержит стандартную вставку RFC 2119 после front matter
      description: >
        Вставка должна находиться в начале документа — после front matter и заголовка первого уровня (H1),
        до начала основного содержимого. Расположение сразу после H1 допустимо и является стандартным паттерном.
      severity: error
      examples:
        pass:
          - text: "# Заголовок\n\nКлючевые слова «ТРЕБУЕТСЯ»... толкуются в соответствии с RFC 2119."
            explanation: 'Вставка сразу после H1 — стандартный допустимый паттерн'
    - id: S2
      rule: Каждая операция содержит секции Вход, Поведение, Расширения, Результат
      severity: error
    - id: S3
      rule: Нет маркеров [NEEDS CLARIFICATION] при status ready или implemented
      severity: error
    - id: S4
      rule: Текст написан в третьем лице — нет обращений на «ты» и императивов
      description: >
        Подозрительны ТОЛЬКО: глаголы в повелительном наклонении (создайте, проверьте, укажите, используйте)
        и обращения на «ты/вы» в авторском тексте.
        НЕ подозрительны: ключевые слова RFC 2119 (ТРЕБУЕТСЯ, ДОЛЖЕН, МОЖЕТ и т.д.),
        текст внутри кавычек, inline-code (`...`), заголовки секций с именами методов.
      severity: error
      examples:
        pass:
          - text: 'Система создаёт запись в таблице sessions.'
          - text: 'Клиент ДОЛЖЕН передать access token в заголовке Authorization.'
            explanation: 'ДОЛЖЕН — ключевое слово RFC 2119, не императив'
          - text: 'Роль: «Проверяй документ на соответствие правилам.»'
            explanation: 'Императив внутри кавычек — цитата, не авторский текст'
        fail:
          - text: 'Создайте запись в таблице sessions.'
            explanation: 'Императив в авторском тексте'
            fix: 'Система создаёт запись в таблице sessions.'
          - text: 'Ты должен передать access token в заголовке.'
            explanation: 'Обращение на «ты»'
            fix: 'Клиент ДОЛЖЕН передать access token в заголовке Authorization.'
    - id: S5
      rule: Ключевые слова RFC 2119 используются по назначению — ТРЕБУЕТСЯ для обязательного поведения, МОЖЕТ для опционального
      severity: error
      examples:
        pass:
          - text: 'Система ТРЕБУЕТСЯ вернуть 401 при невалидном токене.'
        fail:
          - text: 'Система ТРЕБУЕТСЯ логировать запрос.'
            explanation: 'Логирование опционально — следует использовать МОЖЕТ'
            fix: 'Система МОЖЕТ логировать запрос.'
    - id: S6
      rule: Каждый шаг поведения — одно наблюдаемое действие, без «и»
      description: >
        Подозрительны ТОЛЬКО шаги, содержащие союз «и» между глаголами или перечисление нескольких
        независимых действий. Одиночные действия без «и» не требуют проверки.
        НЕ нарушения: ссылки на группу подшагов, перечисление полей/параметров/вариантов через «и»
        в рамках одного действия (например, «возвращает имя и email», «вычисляет precision, recall и F1»).
        Нарушение — два независимых побочных эффекта в одном шаге (например, «создаёт запись и отправляет уведомление»).
      severity: warning
      examples:
        pass:
          - text: 'Система создаёт запись в таблице.'
          - text: 'Система выполняет шаги 5–9 из секции X.'
            explanation: 'Ссылка на подшаги — одно логическое действие'
        fail:
          - text: 'Система создаёт запись в таблице и отправляет уведомление.'
            explanation: 'Два независимых действия в одном шаге'
            fix: 'Разделить на два шага'
    - id: S7
      rule: Текст не содержит разговорной лексики, сленга и неформальных сокращений
      description: >
        Общепринятые технические аббревиатуры (API, JWT, JSON, SQL, HTTP, CLI и т.д.) допустимы.
        Нарушение — просторечные слова и выражения: «кидает», «инфа», «норм», «юзать».
      severity: error
      examples:
        pass:
          - text: 'Система возвращает ошибку валидации.'
        fail:
          - text: 'Система кидает ошибку.'
            explanation: 'Разговорная лексика'
            fix: 'Система возвращает ошибку.'
          - text: 'Инфа о пользователе сохраняется в БД.'
            explanation: 'Сленг и неформальные сокращения'
            fix: 'Информация о пользователе сохраняется в базе данных.'
    - id: S8
      rule: Заголовки секций используют полные формальные названия без сокращений
      severity: warning
  guidance: >
    Цель документа: спецификация для spec-driven development. Каждый пункт должен допускать
    написание автоматического теста без дополнительных уточнений. Не дублируй замечания
    по стилю и формату — они покрыты criteria (S1–S8).

    Оцени содержание по трём направлениям:

    1. Тестируемость: найди шаги поведения, которые нельзя проверить автоматическим тестом
    из-за нечёткой формулировки (например, «система обрабатывает данные», «система корректно
    реагирует»). Укажи конкретный шаг и почему он нетестируем.

    2. Покрытие ошибок: найди шаги, включающие валидацию, внешний вызов, запрос к БД или
    проверку условия, для которых отсутствует расширение. Укажи номер шага и тип возможной
    ошибки.

    3. Полнота потока данных: найди поля из Входа, не используемые в Поведении, или поля
    из Результата, не произведённые шагами Поведения. Укажи конкретное поле.
