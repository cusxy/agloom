$schema: ../meta-schema.json

name: agents-md
version: '0.0.0'
description: >
  Файл инструкций уровня проекта для AI coding-агентов (AGLOOM.md CLAUDE.md, AGENTS.md).
  Содержит команды, стек, конвенции и границы — только информацию, недоступную
  агенту из кода. Оптимальный размер: 60–200 строк. Основан на эмпирических данных
  ETH Zurich (arXiv:2602.11988) и рекомендациях Anthropic.

frontmatter:
  required: {}
  additionalProperties: false

structure:
  headings:
    require_h1: true
    max_h1: 1
    max_depth: 3
    no_level_skip: true
  sections:
    - heading: Команды
      level: 2
      description: >
        Bash-команды для сборки, тестирования, линтинга, запуска dev-среды.
        Размещается первой — агент обращается к командам чаще всего.
      tables:
        - min: 1
    - heading: Стек
      level: 2
      description: Технологический стек с версиями и ключевыми паттернами
    - heading: Конвенции
      level: 2
      description: >
        Конвенции кода, нейминга, стиля, коммитов. Только те, что отличаются
        от стандартных defaults языка и фреймворка.
      lists:
        - type: unordered
          min: 1
    - heading: Тестирование
      level: 2
      optional: true
      severity: warning
      description: Фреймворк, подход, ключевые команды запуска тестов
    - heading:
        pattern: '^(Разработка|Workflow|Git|CI)'
      level: 2
      optional: true
      severity: info
      description: Рабочий процесс разработки, ветвление, CI/CD конвенции
    - heading:
        pattern: '^Документация'
      level: 2
      optional: true
      severity: info
      description: Конвенции документации проекта
    - heading: Границы
      level: 2
      description: >
        Явные запреты с обоснованиями (safety constraints). Каждый запрет
        сопровождается причиной — повышает compliance агента.

prose:
  style: instructional
  language: ru
  rfc2119: optional

review:
  criteria:
    - id: I1
      rule: Каждая инструкция содержит информацию, недоступную агенту из кода
      description: >
        Проверяй ТОЛЬКО следующие паттерны — всё остальное PASS:

        НАРУШЕНИЕ (FAIL) — только когда строка:
        1. Перечисляет файлы и поддиректории внутри конкретного модуля
           (пример: «apps/server/src/auth/ — entities, dto, guards, decorators»).
        2. Пересказывает список сущностей, методов, эндпоинтов, которые агент
           получит, прочитав код.
        3. Называет стандартную конвенцию языка без специфики проекта
           (пример: «Используйте const вместо var»).

        НЕ НАРУШЕНИЕ (PASS) — все остальные строки, в том числе:
        - Любые команды и имена скриптов (pnpm, npm, bash) — агент не знает
          нестандартные имена без явного указания.
        - Порядок и правила выполнения шагов валидации/деплоя.
        - Любые ссылки на файлы («Подробности: path/to/file.md») — легитимны по I5.
        - Конвенции проекта, отличающиеся от defaults: типы полей БД,
          форматы дат, схемы front matter, шаги сортировки, имена полей.
        - Технологический стек секции «Стек» (языки, фреймворки, СУБД, сервисы).
        - Архитектурные решения (выбор между альтернативами, роли компонентов).
        - Методологические инструкции по тестированию (Detroit TDD, testcontainers,
          разделение на managed/unmanaged зависимости).
        - Поведенческие инструкции агенту («при чтении X — читай также Y»).
        - Таблицы соответствия областей ответственности директориям.
        - Конвенции документирования (front matter типы, статусы, форматы полей).
      severity: error
      examples:
        pass:
          - text: 'Денежные суммы: DECIMAL в PostgreSQL, строки в DTO, decimal.js для арифметики.'
            explanation: 'Конвенция проекта, отличающаяся от defaults'
          - text: 'Один пакет: `pnpm --filter @agloom/server run build|lint|test`.'
            explanation: 'Имя скрипта и pipe-синтаксис — агент не знает без явного указания'
          - text: 'Пайплайн валидации: format → build → lint → test. ТРЕБУЕТСЯ выполнять в указанном порядке.'
            explanation: 'Порядок шагов валидации — поведенческая инструкция агенту'
          - text: 'Подмножества format: `fmt:md` / `fmt:md:check`, `fmt:js` / `fmt:js:check`.'
            explanation: 'Нестандартные имена скриптов — агент не знает без явного указания'
          - text: 'Managed-зависимости (PostgreSQL, TypeORM): реальная БД (testcontainers).'
            explanation: 'Методологическая инструкция по тестированию — архитектурное решение'
          - text: 'Unmanaged-зависимости (CurrencyBeacon, CoinAPI): моки/стабы.'
            explanation: 'Стратегия мокирования — методологическая инструкция'
          - text: 'Пользовательская сортировка: поле `position` с разреженной нумерацией (шаг 1000).'
            explanation: 'Специфика проекта (шаг 1000) — нельзя вывести из кода'
          - text: 'Подробности: `.agloom/skills/spec-cycle/SKILL.md`.'
            explanation: 'Ссылка на файл легитимизирована критерием I5'
          - text: 'Каждая папка в `docs/` содержит `index.md` — пререквизит для остальных файлов папки.'
            explanation: 'Поведенческая инструкция агенту'
          - text: 'YAML front matter обязателен. Типы: `index`, `spec`, `doc`, `research`.'
            explanation: 'Конвенция схемы документации'
          - text: 'Exchange Rates: CurrencyBeacon (основной), CoinAPI (запасной).'
            explanation: 'Архитектурное решение о приоритете провайдеров'
          - text: 'Backend: TypeScript, Node.js, NestJS, TypeORM, PostgreSQL 17.'
            explanation: 'Технологический стек секции «Стек» — допустим как ориентир'
        fail:
          - text: 'apps/server/src/auth/ — модуль авторизации с entities, dto, guards.'
            explanation: 'Перечисление поддиректорий модуля — агент обнаружит сам'
    - id: I2
      rule: Файл не превышает 200 строк основного содержимого
      description: >
        Оптимальный диапазон: 60–200 строк (Anthropic, community consensus).
        При > 200 строках — требуется модульная структура (skills, agents).
        При > 500 строках — зона деградации compliance (ETH Zurich, Instruction Gap).
      severity: warning
    - id: I3
      rule: Каждый запрет в секции «Границы» сопровождается обоснованием
      description: >
        Запрет с обоснованием имеет более высокий compliance, чем голый запрет
        (Agent SOP § 1.2). Паттерн: «ЗАПРЕЩАЕТСЯ <действие> — <причина>».
      severity: error
      examples:
        pass:
          - text: 'ЗАПРЕЩАЕТСЯ удалять файлы миграций — необратимое разрушение production-схемы.'
        fail:
          - text: 'ЗАПРЕЩАЕТСЯ удалять файлы миграций.'
            fix: 'ЗАПРЕЩАЕТСЯ удалять файлы миграций — необратимое разрушение production-схемы.'
    - id: I4
      rule: Формулировки конкретны и верифицируемы
      description: >
        Абстрактные формулировки («пишите хороший код», «следуйте best practices»)
        не изменяют поведение модели. Каждая инструкция должна быть достаточно конкретной,
        чтобы compliance можно было проверить (тестом, линтером, ревью).
      severity: error
      examples:
        pass:
          - text: 'Detroit TDD: реальные объекты, минимум моков. testcontainers для PostgreSQL.'
        fail:
          - text: 'Следуйте хорошим практикам тестирования.'
            fix: 'Detroit TDD: реальные объекты, минимум моков. testcontainers для PostgreSQL.'
    - id: I5
      rule: Специализированные инструкции вынесены — корневой файл содержит ссылки
      description: >
        Подробные инструкции для конкретных workflow (spec-cycle, миграции, AI-ревью)
        размещаются в skills или doc-файлах. Корневой файл содержит краткое описание
        и ссылку на источник. Это снижает token overhead и instruction dilution.
      severity: warning
  guidance: >
    Цель файла: передать AI coding-агенту только информацию о проекте, которую
    нельзя вывести из кода. Оценивай каждую строку по принципу: «Приведёт ли
    удаление этой строки к ошибкам агента?» Если нет — строка избыточна.

    Проверь по трём направлениям:

    1. Релевантность (C1): найди инструкции, дублирующие информацию из кода
    (структура директорий, списки сущностей, описания API).

    2. Лаконичность (C2): оцени общий объём. При > 200 строках — указать
    секции, которые можно вынести в skills.

    3. Верифицируемость (C7): найди инструкции, compliance с которыми нельзя
    проверить. Рекомендуй оформить детерминированные действия как hooks.
