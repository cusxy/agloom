$schema: ../meta-schema.json

name: skill
version: '0.1.0'
description: >
  Определение скилла — оркестратора, управляющего запуском агентов или выполнением
  процедуры в основном контексте Claude Code. Рекомендуемые секции описывают
  паттерн циклирующего оркестратора: скилл запускает пары агентов (исполнитель → reviewer)
  в цикле с quality gates, управляет возвратами и формирует сводку.

frontmatter:
  required:
    name:
      type: string
      minLength: 1
      description: Идентификатор скилла (совпадает с именем папки)
    description:
      type: string
      minLength: 1
      description: Краткое описание назначения скилла
  additionalProperties: false

structure:
  headings:
    require_h1: true
    max_h1: 1
    max_depth: 4
    no_level_skip: true
  sections:
    - heading: 'Принцип работы'
      level: 2
      optional: true
      severity: warning
      description: Механизм работы скилла — как управляет агентами, формат ввода/вывода агентов
    - heading:
        pattern: '^(Цикл|Порядок действий|Проверки)'
      level: 2
      optional: true
      severity: warning
      description: Последовательность шагов, граф переходов между агентами, логика возвратов
    - heading:
        pattern: '^Definition of Ready'
      level: 2
      optional: true
      severity: warning
      description: Предусловия запуска скилла — чеклист проверок перед началом цикла
      lists:
        - type: task_list
          min: 1
    - heading:
        pattern: '^Definition of Done'
      level: 2
      optional: true
      severity: warning
      description: Условия завершения скилла — чеклист проверок по окончании цикла
      lists:
        - type: task_list
          min: 1
    - heading: 'Обработка ошибок'
      level: 2
      optional: true
      severity: info
      description: Поведение при повторных fail вердиктах, зацикливании, нештатных ситуациях
    - heading:
        pattern: '^(Сводка|Формат отчёта)'
      level: 2
      optional: true
      severity: info
      description: Формат вывода результатов по завершении цикла

prose:
  style: instructional
  language: ru
  person: second
  rfc2119: optional

references:
  internal_links:
    must_resolve: true
    check_anchors: true

review:
  criteria:
    - id: K1
      rule: Инструкции написаны во втором лице
      description: >
        Допустимы две формы второго лица: декларативная («Ты работаешь inline»,
        «Ты запускаешь агентов») и императивная («Запускай агентов», «Тебе ТРЕБУЕТСЯ»).
        Обе формы валидны. НЕ нарушение: декларативное «Ты определяешь», «Ты работаешь».
        Нарушение: третье лицо «Оркестратор запускает», «Система выполняет».
        Безличные конструкции с RFC 2119 («ТРЕБУЕТСЯ выполнять») допустимы.
      severity: error
      examples:
        pass:
          - text: 'Ты запускаешь агента review-optimizer для оптимизации критериев.'
            explanation: 'Декларативное второе лицо — валидно'
          - text: 'Тебе ТРЕБУЕТСЯ сохранять agent_id каждого запущенного агента.'
            explanation: 'Императивное второе лицо с RFC 2119 — валидно'
          - text: 'Переход к завершению ТРЕБУЕТСЯ выполнять только при verdict: pass.'
            explanation: 'Безличная конструкция с RFC 2119 — допустимо'
        fail:
          - text: 'Оркестратор запускает агента review-optimizer.'
            explanation: 'Третье лицо — скилл должен обращаться к исполнителю напрямую'
    - id: K2
      rule: Описан формат ввода — что пользователь передаёт при вызове скилла
      severity: warning
    - id: K3
      rule: Описан порядок действий — последовательность шагов выполнения
      severity: error
    - id: K4
      rule: Текст не содержит разговорной лексики, сленга и неформальных сокращений
      description: >
        Общепринятые технические термины на английском (inline, scope, debug, commit,
        deploy, Agent tool, verdict, findings, resume) допустимы и НЕ являются сленгом.
        Нарушение — просторечные слова: «кидает», «инфа», «норм», «юзать», «фича».
      severity: error
      examples:
        pass:
          - text: 'Ты работаешь inline в основном контексте.'
            explanation: 'inline — общепринятый технический термин'
          - text: 'При verdict: fail — вернуть на доработку.'
            explanation: 'verdict, fail — терминология протокола агентов'
        fail:
          - text: 'Если что-то сломалось — юзай дебаг.'
            explanation: 'Разговорная лексика'
    - id: K5
      rule: Для циклирующего скилла — описан граф переходов между агентами
      description: >
        Если скилл управляет парами агентов (исполнитель → reviewer), ДОЛЖЕН содержать
        описание графа переходов: какие агенты запускаются, в каком порядке, что происходит
        при verdict pass и fail. НЕ нарушение для простых скиллов без цикла агентов.
      severity: warning
    - id: K6
      rule: Для циклирующего скилла — описана логика возвратов при fail вердиктах
      description: >
        Если скилл содержит цикл агентов, ДОЛЖЕН описывать: возврат к исполнителю
        при fail от reviewer, возможность возврата к ранним фазам, условие остановки
        при повторных fail. НЕ нарушение для простых скиллов.
      severity: warning
  guidance: >
    Скилл — инструкция для LLM, работающего в основном контексте сессии.
    Проверить что инструкции однозначны и не допускают вольных интерпретаций.
    Убедиться что порядок действий описан явно — каждый шаг понятен без контекста
    предыдущих сессий.

    Для циклирующего оркестратора дополнительно проверить:
    - Граф переходов описан полностью (все переходы, включая возвраты).
    - Формат вызова агентов соответствует протоколу (scope + context).
    - DoR проверяется ДО запуска первого агента.
    - DoD проверяется ПОСЛЕ прохождения всех quality gates.
    - Описано поведение при повторных fail (максимальное число ретраев, эскалация).
    - Описан формат сводки по завершении цикла.
